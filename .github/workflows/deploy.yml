name: Deploy
on:
  push:
    branches:
      - master
  workflow_dispatch:
jobs:
  deploy:
    runs-on: [self-hosted, tzer0m]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Stop service
        run: sudo systemctl stop StockWise.service
      - name: Publish
        run: dotnet publish StockWise/StockWise.csproj -c Release -o /home/tzer0m/Services/StockWise
      - name: Start service
        run: sudo systemctl start StockWise.service
      - name: Check status
        run: sudo systemctl status StockWise.service --no-pager
